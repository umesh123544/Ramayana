<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>RAMAYAN - The Epic Journey</title>
    <meta name="description" content="A cinematic Indian mythological 2D action-adventure platformer inspired by the Ramayana featuring hero Umesh, bow combat, divine powers, 10 chapters, checkpoints, and boss encounters." />
    <meta property="og:title" content="RAMAYAN - The Epic Journey" />
    <meta property="og:description" content="A cinematic Indian mythological 2D action-adventure platformer inspired by the Ramayana featuring hero Umesh, bow combat, divine powers, 10 chapters, checkpoints, and boss encounters." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA Favicons & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ramayan" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="bg-neutral-950 text-neutral-100 overflow-hidden select-none">
    <div id="root">
      <div id="app-loading-screen" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0c0a09;color:#fef3c7;font-family:sans-serif;text-align:center;padding:20px;z-index:9999;">
        <div style="font-size:32px;font-weight:900;letter-spacing:4px;color:#f59e0b;margin-bottom:8px;font-family:'Cinzel',serif;">RAMAYAN</div>
        <div style="font-size:13px;color:#d97706;letter-spacing:2px;margin-bottom:28px;font-weight:600;">THE EPIC JOURNEY</div>
        <div style="width:40px;height:40px;border:3px solid rgba(245,158,11,0.2);border-top-color:#f59e0b;border-radius:50%;animation:ramayanSpin 0.9s linear infinite;"></div>
        <p style="margin-top:18px;font-size:13px;color:#d6d3d1;letter-spacing:0.5px;">Awakening the Divine Realm...</p>
        <style>
          @keyframes ramayanSpin {
            to { transform: rotate(360deg); }
          }
        </style>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('app-loading-screen');
        if (loader && !document.getElementById('ramayan-fatal-err')) {
          loader.innerHTML = '<div id="ramayan-fatal-err" style="max-width:360px;padding:20px;background:#1c1917;border:1px solid #f59e0b;border-radius:12px;color:#fef3c7;font-family:sans-serif;text-align:center;">' +
            '<div style="font-size:18px;font-weight:bold;color:#f59e0b;margin-bottom:8px;">Sacred Realm Interrupted</div>' +
            '<div style="font-size:12px;color:#e7e5e4;margin-bottom:16px;">' + (e.message || 'Error initializing application') + '</div>' +
            '<button onclick="window.location.reload()" style="background:#f59e0b;color:#0c0a09;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;">Reload Game</button>' +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
